[versions]
agp = "9.3.3"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
# CHANGED 2.6.1 -> 2.10.0: current stable line that pairs with activity 1.13 and the Compose BOM below.
# Reference: https://developer.android.com/jetpack/androidx/releases/lifecycle
lifecycleRuntimeKtx = "2.10.0"
# CHANGED 1.8.0 -> 1.13.0: current stable. Reference: https://developer.android.com/jetpack/androidx/releases/activity
activityCompose = "1.13.0"
# androidx.activity (activity-compose) and androidx.fragment interact internally for the Activity Result API.
# AGP lint flags InvalidFragmentVersionForActivityResult if a transitive dependency resolves fragment below 1.3.0,
# so fragment is pinned explicitly. Reference: https://developer.android.com/jetpack/androidx/releases/fragment
fragment = "1.9.1"
kotlin = "2.2.10"
composeBom = "2026.02.01"
# CHANGED 1.7.3 -> 1.10.2: 1.7.3 predates Kotlin 2.x. 1.10.2 is the newest release built against the Kotlin 2.1
# stdlib, so it is safe with the Kotlin 2.2.10 compiler (1.11.0 is newer but built for a later Kotlin line).
kotlinxCoroutines = "1.10.2"
# ADDED: JSON schema for the persisted parking record, shared with a future iOS target (research R4).
# 1.9.0 is the serialization runtime released for the Kotlin 2.2 compiler plugin.
kotlinxSerialization = "1.9.0"
playServicesLocation = "21.1.0"
# CHANGED 1.0.0 -> 1.2.1: typed DataStore with ReplaceFileCorruptionHandler (research R4, FR-018).
datastoreVersion = "1.2.1"
# ADDED: JVM host tests for Android adapters and Compose semantics tests (research R10, Constitution III).
robolectric = "4.17"
androidxTestCore = "1.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
# The JUnit4 flavour of kotlin-test maps kotlin.test.Test onto JUnit4 for Android host tests.
kotlin-test-junit = { group = "org.jetbrains.kotlin", name = "kotlin-test-junit", version.ref = "kotlin" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastoreVersion" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# AGP 9 replaces "com.android.library" for Kotlin Multiplatform modules with this plugin.
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
# REMOVED: com.google.protobuf plugin and protobuf-kotlin/datastore-proto libraries. Persistence now uses typed
# DataStore with a kotlinx.serialization JSON schema defined in commonMain (research R4).
